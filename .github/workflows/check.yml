name: Check
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo replays unchanged tasks; integration tests against PostgreSQL and Redis never cache.
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Only committed example values: no repository secret reaches the checks or their artifacts.
      - name: Configure local environments
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/api/.env.test.example apps/api/.env.test
          cp apps/platform/.env.example apps/platform/.env
          cp packages/db/.env.test.example packages/db/.env.test
      - run: pnpm check:ci
      - name: Publish test coverage
        if: always()
        run: pnpm exec tsx scripts/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Verify checks left the working tree unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure local environments
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/api/.env.test.example apps/api/.env.test
          cp apps/platform/.env.example apps/platform/.env
      - name: Install Chromium
        run: pnpm --filter @inzpro/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14
  # dev deploys staging and main deploys production (ADR-0017), only after the checks passed for
  # this commit. Docker Hub notifies Dokploy, which pulls the new images; the API migrates before it
  # starts. See docs/deployment.md.
  deploy:
    if: github.event_name == 'push'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    # One deployment per environment. A newer push waits for the running one and never cancels it;
    # GitHub drops an older deployment still waiting behind a newer one.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Images carry `latest` for Dokploy, so an older run finishing late must not replace the newer
      # commit's images: only the branch head deploys, and the head's own run deploys it.
      - name: Check that this commit is still the branch head
        id: head
        run: |
          head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping the deployment: ${GITHUB_REF_NAME} moved to ${head}, whose run deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@v4
      # Each image lives in its own Docker Hub account per environment (a free account holds one
      # private repository), as in V1. A login to docker.io replaces the previous one, so each push
      # logs in to its own account first.
      # The API first: it runs the migrations the new worker expects.
      - name: Log in to the API image's Docker Hub account
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.API_DOCKERHUB_USERNAME }}
          password: ${{ secrets.API_DOCKERHUB_TOKEN }}
      - name: Push the API image
        if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.API_IMAGE }}:latest
            ${{ vars.API_IMAGE }}:${{ github.sha }}
      - name: Log in to the worker image's Docker Hub account
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.WORKER_DOCKERHUB_USERNAME }}
          password: ${{ secrets.WORKER_DOCKERHUB_TOKEN }}
      - name: Push the worker image
        if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.WORKER_IMAGE }}:latest
            ${{ vars.WORKER_IMAGE }}:${{ github.sha }}
