name: Check
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure local environments
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/api/.env.test.example apps/api/.env.test
          cp apps/platform/.env.example apps/platform/.env
          cp packages/db/.env.test.example packages/db/.env.test
      - run: pnpm --filter @inzpro/api services:test:up
      - run: pnpm --filter @inzpro/api migrate:test
      - run: pnpm check:ci
      - name: Verify checks did not modify tracked sources
        run: git diff --exit-code
      - name: Stop test services
        if: always()
        run: pnpm --filter @inzpro/api services:test:down
