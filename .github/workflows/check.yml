name: Check
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure local environments
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/api/.env.test.example apps/api/.env.test
          cp apps/platform/.env.example apps/platform/.env
          cp packages/db/.env.test.example packages/db/.env.test
      - run: pnpm check:ci
      - name: Publish test coverage
        if: always()
        run: pnpm exec tsx scripts/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Verify checks did not modify tracked sources
        run: git diff --exit-code
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure local environments
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/api/.env.test.example apps/api/.env.test
          cp apps/platform/.env.example apps/platform/.env
      - name: Install Chromium
        run: pnpm --filter @inzpro/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14

  deploy-platform:
    needs: [check, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-platform-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
      cancel-in-progress: false
    env:
      CI: 'true'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_MAIN_PAGE_BASE_URL: ${{ vars.VITE_MAIN_PAGE_BASE_URL }}
      COOKIES_DOMAIN: ${{ vars.COOKIES_DOMAIN }}
      VITE_GOOGLE_TAG_MANAGER_ID: ${{ vars.VITE_GOOGLE_TAG_MANAGER_ID }}
      VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Skip superseded revisions
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping a revision superseded by a newer push.'
          fi
      - name: Deploy checked revision
        if: steps.revision.outputs.current == 'true'
        run: pnpm cloudflare deploy "${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}"
