name: Check
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure local environments
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/api/.env.test.example apps/api/.env.test
          cp apps/platform/.env.example apps/platform/.env
          cp packages/db/.env.test.example packages/db/.env.test
      - run: pnpm check:ci
      - name: Publish test coverage
        if: always()
        run: pnpm exec tsx scripts/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Verify checks did not modify tracked sources
        run: git diff --exit-code
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure local environments
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/api/.env.test.example apps/api/.env.test
          cp apps/platform/.env.example apps/platform/.env
      - name: Install Chromium
        run: pnpm --filter @inzpro/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14
