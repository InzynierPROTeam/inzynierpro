services:
  postgres:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-monorepo}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER:-user}', '-d', '${POSTGRES_DB:-monorepo}']
      interval: 1s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-password}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-password}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data_dev:/data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 5s
      retries: 30
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - minio server /data --console-address :9001 &
        until mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done &&
        mc mb --ignore-existing "local/$$FILE_STORAGE_BUCKET" &&
        wait
    environment:
      MINIO_ROOT_USER: ${FILE_STORAGE_ACCESS_KEY_ID:-inzpro}
      MINIO_ROOT_PASSWORD: ${FILE_STORAGE_SECRET_ACCESS_KEY:-password}
      FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET:-inzpro-files}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data_dev:/data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'mc stat "local/$$FILE_STORAGE_BUCKET" >/dev/null']
      interval: 1s
      timeout: 5s
      retries: 30
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    profiles: ['telemetry']
    restart: unless-stopped
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
      - '${OTLP_HTTP_PORT:-4318}:4318'
volumes:
  postgres_data_dev:
  redis_data_dev:
  minio_data_dev:
