services:
  postgres-test:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: inzpro_test
      POSTGRES_PASSWORD: inzpro_test
      POSTGRES_DB: inzpro_test
    ports:
      - '${TEST_POSTGRES_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'inzpro_test', '-d', 'inzpro_test']
      interval: 1s
      timeout: 5s
      retries: 30
  redis-test:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:-password}',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-password}
    ports:
      - '${TEST_REDIS_PORT:-56379}:6379'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 5s
      retries: 30
  minio-test:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ['/bin/sh', '-c']
    command:
      - minio server /data &
        until mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done &&
        mc mb --ignore-existing "local/$$FILE_STORAGE_BUCKET" &&
        wait
    environment:
      MINIO_ROOT_USER: ${FILE_STORAGE_ACCESS_KEY_ID:-inzpro_test}
      MINIO_ROOT_PASSWORD: ${FILE_STORAGE_SECRET_ACCESS_KEY:-inzpro_test}
      FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET:-inzpro-files-test}
      MINIO_API_CORS_ALLOW_ORIGIN: ${E2E_PLATFORM_ORIGIN:-http://localhost:8101}
    ports:
      - '${TEST_MINIO_PORT:-59000}:9000'
    tmpfs:
      - /data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'mc stat "local/$$FILE_STORAGE_BUCKET" >/dev/null']
      interval: 1s
      timeout: 5s
      retries: 30
