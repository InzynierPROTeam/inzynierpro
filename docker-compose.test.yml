services:
  postgres-test:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inzpro_test
      POSTGRES_PASSWORD: inzpro_test
      POSTGRES_DB: inzpro_test
    ports:
      - '${TEST_POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'inzpro_test', '-d', 'inzpro_test']
      interval: 1s
      timeout: 5s
      retries: 30
  redis-test:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-password}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-password}
    ports:
      - '${TEST_REDIS_PORT:-56379}:6379'
    volumes:
      - redis_test_data:/data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 5s
      retries: 30
volumes:
  postgres_test_data:
  redis_test_data:
